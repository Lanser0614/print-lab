services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - composer-cache:/home/app/.composer/cache
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: printlab
      DB_USERNAME: printlab
      DB_PASSWORD: printlab
      REDIS_HOST: redis
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -lc "
        composer install &&
        if grep -q '^DB_CONNECTION=sqlite' .env 2>/dev/null; then cp .env.docker .env; fi &&
        test -f .env || cp .env.docker .env &&
        php artisan key:generate --force --ansi &&
        php artisan config:clear --ansi &&
        php artisan migrate --seed --force --ansi &&
        php artisan storage:link --force --ansi &&
        php artisan serve --host=0.0.0.0 --port=8000
      "

  vite:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    environment:
      VITE_HOST: 0.0.0.0
      npm_config_cache: /tmp/npm-cache
    command: >
      sh -lc "
        npm install &&
        npm run dev -- --host 0.0.0.0
      "

  mysql:
    image: mysql:8.4
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: printlab
      MYSQL_USER: printlab
      MYSQL_PASSWORD: printlab
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

volumes:
  composer-cache:
  mysql-data:
  redis-data:
